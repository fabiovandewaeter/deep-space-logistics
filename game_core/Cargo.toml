# game_core/Cargo.toml
[package]
name = "game_core"
version = "0.1.0"
edition = "2024"

[features]
default = ["native"]
# default = ["wasm"]
native = []
wasm = []

[lib]
name = "game_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"] # important pour wasm-bindgen / wasm-pack

[[bin]]
name = "game_core-cli"
path = "src/main.rs"

[dependencies]
console_error_panic_hook = "0.1.7"
hecs = { version = "0.11.0", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.108"
web-sys = { version = "0.3", features = ["console"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
